# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Mehrere Änderungen und Prozentpunkte
description: "Mehrere prozentuale Änderungen nacheinander mit Faktoren berechnen – und Prozente von Prozentpunkten unterscheiden."
blocks:
  - type: text
    text: |
      **Ziel:** Ich kann mehrere Änderungen nacheinander berechnen und Prozente von Prozentpunkten unterscheiden. Du
      brauchst den Faktor von der Seite [Zunahme und Abnahme](/w3-prozent/zu-abnahme/) und den Vergleich der
      vorigen Seite.
  - type: section
    id: start
    title: Probier zuerst
    blocks:
      - type: number
        id: mehrere-aenderungen-start
        text: Eine Jacke kostet 100 €. Erst steigt der Preis um 20 %, einen Monat später sinkt der neue Preis um 20 %. Wie viel kostet die Jacke dann?
        answer: 96
        tolerance: 0
        unit: €
        mistakes:
          - answer: 100
            message: "Von welchem Preis werden die zweiten 20 % genommen?"
          - answer: 120
            message: "Das ist der Preis nach der Erhöhung."
          - answer: 104
            message: "Die zweiten 20 % sind mehr Euro als die ersten."
        hint: Rechne Schritt für Schritt. Was kostet die Jacke nach der Erhöhung?
        explanation: "Erst 120 €. 20 % von 120 € sind 24 €, also 120 € − 24 € = 96 €."
        links:
          - title: Einführung in den verminderten und vermehrten Grundwert (Serlo)
            url: https://de.serlo.org/mathe/37829/zusammenfassung
  - type: section
    id: regel
    title: Faktoren multiplizieren
    blocks:
      - type: text
        text: |
          In der Aufgabe oben ist der Grundwert der zweiten Änderung nicht mehr 100 €, sondern 120 €. Darum sind
          die zweiten 20 % mehr Euro als die ersten. Mit Faktoren geht es in einer Rechnung: erst · 1,2, dann · 0,8.
      - type: figure
        image: images/w3-kette.svg
        alt: "Drei Kästen: 100 €, Pfeil · 1,2, 120 €, Pfeil · 0,8, 96 €. Ein oranger Pfeil führt von 100 € direkt zu 96 € und trägt · 0,96."
        caption: Der orange Pfeil fasst beide Schritte zusammen. Achte auf seinen Faktor.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: formula
        formula: '1{,}2 \cdot 0{,}8 = 0{,}96 = 96\,\%'
      - type: text
        text: |
          Nach beiden Änderungen bleiben 96 % – der Preis ist insgesamt um 4 % gesunken. Die Reihenfolge ist egal:
          0,8 · 1,2 ist auch 0,96.

          Ein Wert, der selbst ein Prozentsatz ist, ändert sich in **Prozentpunkten**. Steigt der Anteil der Kinder
          mit Brille von 16 % auf 19 %, ist das ein Plus von 3 Prozentpunkten. Wie viel Prozent mehr das ist, sagt
          der Vergleich der vorigen Seite:
      - type: formula
        formula: '19\,\% - 16\,\% = 3 \text{ Prozentpunkte}'
      - type: formula
        formula: '3 : 16 = 0{,}1875 = 18{,}75\,\%'
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Rabatt auf den Rabatt
        blocks:
          - type: text
            text: |
              Ein Fahrrad kostet 500 €. Es ist um 10 % reduziert, und an der Kasse gibt es noch einmal 10 % auf den
              reduzierten Preis. Was kostet das Rad, und wie viel Prozent sparst du insgesamt?
          - type: formula
            formula: '0{,}9 \cdot 0{,}9 = 0{,}81 \qquad 500 \cdot 0{,}81 = 405'
          - type: text
            text: |
              Antwort – Das Rad kostet 405 €. Du zahlst 81 % und sparst insgesamt 19 % – nicht 20 %, denn die
              zweiten 10 % werden vom kleineren Preis genommen.
  - type: section
    id: merke
    title: Prozente addierst du nicht
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Bei mehreren Änderungen multiplizierst du die Faktoren. Plus 20 % und minus 20 % heben sich nicht auf.
              Und: Prozentpunkte sind der Unterschied zweier Prozentsätze. „Um 3 Prozentpunkte“ ist etwas anderes als
              „um 3 %“.
  - type: section
    id: uebung
    title: Jetzt du
    blocks:
      - type: single-choice
        id: mehrere-aenderungen-rechnung
        text: Ein Preis G steigt erst um 10 % und sinkt dann um 30 %. Mit welcher Rechnung bekommst du den neuen Preis?
        options:
          - text: "G · 0,8"
            correct: false
            info: "+10 % − 30 % = −20 %: Prozente verrechnet."
          - text: "G · 1,1 · 0,3"
            correct: false
            info: "Mit 0,3 bekommst du nur die Abnahme."
          - text: "G · 1,1 · 0,7"
            correct: true
            info: "Faktoren 1,1 und 0,7, multipliziert."
          - text: "G · 1,1 + G · 0,7"
            correct: false
            info: "Hier werden zwei Preise addiert."
        explanation: "Nacheinander heißt: Faktoren multiplizieren, G · 1,1 · 0,7 = G · 0,77."
        links:
          - title: Einführung in den verminderten und vermehrten Grundwert (Serlo)
            url: https://de.serlo.org/mathe/37829/zusammenfassung
      - type: true-false
        id: mehrere-aenderungen-reihenfolge
        text: Erst 10 % Rabatt, dann 10 % Aufschlag – oder erst 10 % Aufschlag, dann 10 % Rabatt. Beide Male kommt derselbe Preis heraus.
        answer: true
        explanation: "0,9 · 1,1 = 1,1 · 0,9 = 0,99. Beim Malnehmen darfst du tauschen."
        links:
          - title: Einführung in den verminderten und vermehrten Grundwert (Serlo)
            url: https://de.serlo.org/mathe/37829/zusammenfassung
      - type: generated
        id: mehrere-aenderungen-preis
        given:
          G: { int: [100, 600], step: 100 }
          p: { oneOf: [10, 20, 30, 40, 50] }
          q: { oneOf: [10, 20, 30, 40, 50] }
        task:
          text: "Eine Spielkonsole kostet {{G}} €. Erst steigt der Preis um {{p}} %, später sinkt der neue Preis um {{q}} %. Wie viel kostet die Konsole dann?"
        answer: { value: "G * (100 + p) * (100 - q) / 10000", compare: { number: { format: money } } }
        mistakes:
          - value: "G * (100 + p - q) / 100"
            message: "Du hast die Prozente verrechnet. Multipliziere die Faktoren."
          - value: "G * (100 + p) / 100"
            message: "Das ist der Preis nach der Erhöhung."
          - value: "G * (100 - q) / 100"
            message: "Du hast die Erhöhung um {{p}} % vergessen."
        hint: Schreibe zu jeder Änderung den Faktor auf.
        steps:
          - "Mit G = {{G}} €: Faktor für +{{p}} % ist (100 + {{p}}) : 100, für −{{q}} % ist er (100 − {{q}}) : 100."
          - '$ {{G}} \cdot \frac{100 + {{p}}}{100} \cdot \frac{100 - {{q}}}{100} = {{answer}}$'
          - "Die Konsole kostet dann {{answer}} €."
      - type: generated
        id: mehrere-aenderungen-insgesamt
        given:
          p: { oneOf: [10, 20, 30, 40, 50] }
          q: { oneOf: [10, 20, 25, 50] }
        task:
          text: "Eine Hose ist um {{p}} % reduziert. An der Kasse gibt es noch einmal {{q}} % auf den reduzierten Preis. Um wie viel Prozent ist die Hose insgesamt billiger als vorher?"
        answer: { value: "100 - (100 - p) * (100 - q) / 100", compare: { number: { format: percent, decimals: 1 } } }
        mistakes:
          - value: "p + q"
            message: "Die {{q}} % werden vom reduzierten Preis genommen."
          - value: "(100 - p) * (100 - q) / 100"
            message: "So viel Prozent zahlst du noch."
          - value: "p * q / 100"
            message: "Multipliziere die Faktoren, nicht die Prozentsätze."
        hint: Wie viel Prozent bleiben nach jedem Rabatt?
        steps:
          - "Nach {{p}} % Rabatt bleiben (100 − {{p}}) %, nach {{q}} % bleiben (100 − {{q}}) %."
          - '$\frac{100 - {{p}}}{100} \cdot \frac{100 - {{q}}}{100}$ ist der Anteil, den du noch zahlst.'
          - "Die Hose ist insgesamt um {{answer}} % billiger."
      - type: multiple-choice
        id: mehrere-aenderungen-punkte
        text: Der Anteil der Kinder einer Schule, die mit dem Rad kommen, steigt von 20 % auf 25 %. Welche Aussagen stimmen?
        options:
          - text: Der Anteil steigt um 5 %.
            correct: false
            info: "5 % mehr wären 21 %."
          - text: Der Anteil steigt um 5 Prozentpunkte.
            correct: true
            info: "25 % − 20 % = 5 Prozentpunkte."
          - text: Der Anteil steigt um 20 Prozentpunkte.
            correct: false
            info: "Das hieße: von 20 % auf 40 %."
          - text: Der Anteil steigt um 25 %.
            correct: true
            info: "Verglichen mit den alten 20 %: 5 : 20 = 0,25 = 25 %."
        explanation: "Unterschied: 5 Prozentpunkte. Bezogen auf die alten 20 %: plus 25 %."
        links:
          - title: Aufgaben zu Prozent und Prozentpunkten (Serlo)
            url: https://de.serlo.org/mathe/174192/aufgaben-zu-prozent-und-prozentpunkten
      - type: number
        id: mehrere-aenderungen-wahl
        text: Bei der Wahl zur Schülervertretung bekam eine Liste letztes Jahr 8 % der Stimmen, dieses Jahr 10 %. Um wie viel Prozent ist ihr Anteil gestiegen?
        answer: 25
        tolerance: 0
        unit: "%"
        mistakes:
          - answer: 2
            message: "Das sind Prozentpunkte, nicht Prozent."
          - answer: 20
            message: "Verglichen wird mit dem Anteil vom letzten Jahr."
        hint: Vergleiche den Unterschied mit den 8 % vom letzten Jahr.
        explanation: "Plus 2 Prozentpunkte. Bezogen auf 8 %: 2 : 8 = 0,25 = 25 %."
        links:
          - title: Aufgaben zu Prozent und Prozentpunkten (Serlo)
            url: https://de.serlo.org/mathe/174192/aufgaben-zu-prozent-und-prozentpunkten
      - type: text
        text: |
          Damit hast du das Kapitel zur Wahlaufgabe W3 geschafft: Du rechnest mit Faktoren vorwärts und rückwärts,
          vergleichst in Prozent und unterscheidest Prozent von Prozentpunkten. Im nächsten Kapitel geht es um die
          [Wahlaufgabe W4: zweistufige Zufallsversuche](/w4-zufall/ohne-zuruecklegen/).
