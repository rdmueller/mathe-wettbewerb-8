# Bruchaufgaben mit zwei Brüchen (Nenner bis 12). Alle Ergebnisse gekürzt, als Text (die Auswahl zeigt sie so),
# von Hand nachgerechnet. a/b und c/d: die beiden Brüche der Rechnung; schritt1, schritt2: der Rechenweg.
# ergebnis: richtig. fehler1 bis fehler3 je nach art (a/b und c/d sind die beiden Brüche, HN der Hauptnenner):
# - plus:    fehler1 = (a + c)/(b + d), Zähler plus Zähler, Nenner plus Nenner (IQB „Apfelsaftschorle“);
#            fehler2 = (a + c)/HN, Zähler nicht erweitert; fehler3 = (a + c)/(b · d), Nenner multipliziert,
#            Zähler nicht erweitert. Nenner haben einen gemeinsamen Teiler, damit fehler2 und fehler3 verschieden sind.
# - minus:   fehler1 = (a − c)/(b − d); fehler2 = (a − c)/HN, Zähler nicht erweitert; fehler3 = a/b + c/d.
# - mal:     fehler1 = (a · d)/(b · c), zweiten Bruch umgedreht wie beim Teilen; fehler2 = erst auf den HN
#            erweitert, dann die Zähler multipliziert und den Nenner behalten; fehler3 = a/b + c/d.
# - geteilt: fehler1 = den ersten statt den zweiten Bruch umgedreht; fehler2 = mal gerechnet, nichts umgedreht;
#            fehler3 = beide Brüche umgedreht.
- art: plus
  a: 3
  b: 4
  c: 1
  d: 6
  schritt1: "Hauptnenner von 4 und 6 ist 12, die kleinste Zahl, in der beide aufgehen. Erweitert: 3/4 = 9/12 und 1/6 = 2/12."
  schritt2: "9/12 + 2/12 = 11/12."
  ergebnis: "11/12"
  fehler1: "2/5"
  fehler2: "1/3"
  fehler3: "1/6"
