# Urnen mit roten und blauen Kugeln (höchstens 10) für zweimaliges Ziehen. Ohne Zurücklegen, wo nicht anders genannt.
# Alle Brüche gekürzt, als Text (die Auswahl zeigt sie so), mit Python (fractions) nachgerechnet; in jedem Datensatz
# sind die vier Optionen jeder Aufgabe verschieden (darum keine Urne mit gleich vielen roten und blauen Kugeln).
# rot1, blau1, n1: je eins weniger (2. Zug); nn = n · n1; zRR = rot · rot1, zRB = rot · blau, zGenau = 2 · zRB,
# zBB = blau · blau1 (Zähler der Pfade über nn).
# prr = P(zweimal rot), richtig; prrMit = mit Zurücklegen gerechnet; prrAlterNenner = im 2. Zug den alten Nenner n
# behalten; prrZaehler = im 2. Zug den Nenner angepasst, aber nicht den Zähler.
# pGenau = P(genau einmal rot) = P(rb) + P(br); pEinPfad = nur P(rb); pGenauMit = mit Zurücklegen.
# pMind = P(mindestens einmal rot) = 1 − P(bb); pKein = P(bb); pHoechstens = P(höchstens einmal rot) = 1 − P(rr);
# pMindMit, pHoechstensMit = mit Zurücklegen gerechnet.
