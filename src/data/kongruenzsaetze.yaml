# Gegebene Stücke eines Dreiecks ABC (gegen den Uhrzeigersinn, Seite a gegenüber A, α bei A) und welcher
# Kongruenzsatz passt. Jeder Datensatz von Hand geprüft: SSS mit Dreiecksungleichung; SsW mit dem Winkel gegenüber der
# längeren Seite; sSW so gewählt, dass es wirklich zwei Dreiecke gibt (Höhe zur freien Ecke < kürzere Seite < längere
# Seite); bei zwei Winkeln, die nicht beide an der Seite liegen (SWW), wird mit der Winkelsumme WSW daraus.
# Felder:
# stuecke = die Angabe der Aufgabe; satz = der passende Satz; lage = warum (für die Lösungsschritte);
# verwechselt = der Satz, der bei einem typischen Fehler herauskommt, warum = Rückmeldung dazu (sagt nicht die Lösung);
# eindeutig/gegenteil = "eindeutig" oder "nicht eindeutig" und das Gegenteil, begruendung = Rückmeldung, wenn jemand
# das Gegenteil wählt;
# winkel, ecke, gegenueber, anliegend = ein gegebener Winkel, seine Ecke, die Seite gegenüber, eine Seite an der Ecke
# ("–" bei SSS);
# zuerst = was man zuerst zeichnet, zuerstFalsch1/2 = zwei falsche Wahlen ("–" bei sSW und WWW).
- stuecke: "a = 5 cm, b = 7 cm, γ = 40°"
  satz: SWS
  lage: "γ liegt bei C. Dort treffen sich a und b: Der Winkel liegt zwischen den beiden Seiten."
  verwechselt: SsW
  warum: "Prüfe, wo γ liegt: an der Ecke C. Welche Seiten treffen sich dort?"
  eindeutig: eindeutig
  gegenteil: nicht eindeutig
  begruendung: "Zwei Seiten und der Winkel zwischen ihnen legen das Dreieck fest. Es gibt nur eine Möglichkeit."
