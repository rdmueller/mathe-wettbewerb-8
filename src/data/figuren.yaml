# Großbuchstaben in einfacher Blockschrift (Druckschrift ohne Serifen). Nur Buchstaben, deren Symmetrie nicht von der
# Schrift abhängt; ohne O, X, K und Ziffern.
# achsen = Anzahl der Symmetrieachsen, senkrecht = Anzahl der senkrechten Achsen (0 oder 1),
# punktsymmetrisch = gleich nach einer halben Drehung (180°) um die Mitte.
# art fasst achsen und punktsymmetrisch für die Auswahl zusammen; artVerwechselt = die Art, die herauskommt, wenn man
# Achsen- und Punktsymmetrie verwechselt (bei „beides“ und „weder noch“ dieselbe wie art).
- zeichen: A
  achsen: 1
  senkrecht: 1
  punktsymmetrisch: false
  art: nur achsensymmetrisch
  artVerwechselt: nur punktsymmetrisch
