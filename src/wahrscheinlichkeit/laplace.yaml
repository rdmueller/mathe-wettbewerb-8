# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Ergebnisraum und Laplace-Wahrscheinlichkeit
description: "Alle Ergebnisse eines Zufallsversuchs aufschreiben, die günstigen zählen und die Wahrscheinlichkeit als Bruch angeben – und erkennen, wann das nicht geht."
blocks:
  - type: text
    text: |
      **Ziel:** Ich kann den Ergebnisraum aufschreiben und die Laplace-Wahrscheinlichkeit berechnen. Du brauchst
      dafür nur Brüche und das Kürzen – mehr dazu im Kapitel [Bruchrechnung](/brueche/plus-minus/) weiter hinten.
  - type: section
    id: start
    title: Probier zuerst
    blocks:
      - type: number
        id: laplace-start
        text: Du würfelst einmal mit einem normalen Spielwürfel. Du gewinnst, wenn eine Zahl größer als 4 fällt. Bei wie vielen der möglichen Augenzahlen gewinnst du?
        answer: 2
        tolerance: 0
        mistakes:
          - answer: 3
            message: "Prüfe die 4. „Größer als 4“ heißt: Die 4 selbst zählt nicht."
          - answer: 1
            message: "Es gibt mehr als eine Augenzahl über 4. Geh alle Zahlen des Würfels durch."
        hint: Schreib alle Augenzahlen auf, die ein Würfel zeigen kann.
        explanation: "Ein Würfel zeigt 1, 2, 3, 4, 5 oder 6. Größer als 4 sind nur die 5 und die 6, also 2 Augenzahlen."
        links:
          - title: Ergebnismenge (Serlo)
            url: https://de.serlo.org/mathe/1501/ergebnismenge
  - type: section
    id: regel
    title: Günstige durch alle
    blocks:
      - type: text
        text: |
          Würfeln ist ein **Zufallsversuch**: Du weißt vorher nicht, was herauskommt. Jeder mögliche Ausgang heißt
          **Ergebnis**. Alle Ergebnisse zusammen bilden den **Ergebnisraum** $\Omega$ (sprich „Omega“). Ein
          **Ereignis** $E$ ist ein Teil davon, zum Beispiel „Zahl größer als 4“. Seine Ergebnisse heißen
          **günstig**.
      - type: figure
        image: images/wahrscheinlichkeit-wuerfel.svg
        alt: Die sechs Seiten eines Würfels mit 1 bis 6 Augen in einer Reihe. Die Seiten mit 5 und 6 Augen sind orange umrandet.
        caption: "Alle sechs Ergebnisse des Würfels. Orange sind die günstigen aus der Aufgabe oben: 2 von 6."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: formula
        formula: '\Omega = \{1; 2; 3; 4; 5; 6\} \qquad E = \{5; 6\}'
      - type: text
        text: |
          Jede Seite des Würfels fällt gleich oft, wenn du sehr oft würfelst. Ist das bei allen Ergebnissen so,
          heißt der Versuch **Laplace-Versuch**. Dann ist die Wahrscheinlichkeit $P(E)$ der Anteil der günstigen an
          allen Ergebnissen – in der Aufgabe oben 2 von 6:
      - type: formula
        formula: 'P(E) = \frac{\text{günstige}}{\text{alle}}'
      - type: formula
        formula: 'P(\text{größer als 4}) = \frac{2}{6} = \frac{1}{3}'
      - type: text
        text: Gib die Wahrscheinlichkeit als gekürzten Bruch an. Sie liegt immer zwischen 0 (unmöglich) und 1 (sicher).
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Glücksrad mit Primzahlen
        blocks:
          - type: figure
            image: images/wahrscheinlichkeit-gluecksrad.svg
            alt: Ein Glücksrad mit 8 gleich großen Feldern, beschriftet mit 1 bis 8, oben ein Zeiger.
            caption: Alle 8 Felder sind gleich groß, also ist jede Zahl gleich wahrscheinlich.
            source: eigene Zeichnung
            licence: CC-BY-4.0
          - type: text
            text: |
              Du gewinnst bei einer Primzahl. Eine Primzahl hat genau zwei Teiler, 1 und sich selbst. Die 1 hat nur
              einen Teiler und ist darum keine Primzahl.
          - type: formula
            formula: '\Omega = \{1; 2; 3; 4; 5; 6; 7; 8\}'
          - type: formula
            formula: 'E = \{2; 3; 5; 7\}'
          - type: formula
            formula: 'P(E) = \frac{4}{8} = \frac{1}{2}'
          - type: text
            text: Antwort – Du gewinnst mit der Wahrscheinlichkeit 1/2, also in etwa jedem zweiten Spiel.
  - type: section
    id: merke
    title: Nicht jeder Versuch ist ein Laplace-Versuch
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              „Günstige durch alle“ gilt nur, wenn alle Ergebnisse gleich wahrscheinlich sind. Mit zwei Würfeln gibt
              es die Augensummen 2 bis 12. Die 7 entsteht aber auf 6 Arten (1 + 6, 2 + 5, …, 6 + 1), die 2 nur auf
              eine (1 + 1). Die 7 ist also viel wahrscheinlicher. Ebenso bei einer Urne mit 3 roten und 7 blauen
              Kugeln: Nimm als Ergebnisse die einzelnen Kugeln, nicht nur die Farben „rot“ und „blau“.
  - type: section
    id: uebung
    title: Jetzt du
    blocks:
      - type: single-choice
        id: laplace-urne
        text: Du ziehst ohne hinzusehen eine Kugel aus dieser Urne. Wie groß ist die Wahrscheinlichkeit, eine rote Kugel zu ziehen?
        material:
          - type: figure
            image: images/wahrscheinlichkeit-urne.svg
            alt: Eine Urne mit 8 Kugeln. 3 Kugeln sind rot und mit r beschriftet, 5 sind blau und mit b beschriftet.
            caption: Die Kugeln sind gleich groß und fühlen sich gleich an. Nur die Farbe ist verschieden.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: 3/8
            correct: true
            info: 3 der 8 Kugeln sind rot.
          - text: 1/2
            correct: false
            info: Die zwei Farben sind nicht gleich wahrscheinlich, denn es gibt mehr blaue Kugeln.
          - text: 3/5
            correct: false
            info: Das ist rote durch blaue. Im Nenner stehen alle Kugeln.
          - text: 5/8
            correct: false
            info: 5/8 ist die Wahrscheinlichkeit für eine blaue Kugel.
        explanation: "Jede der 8 Kugeln ist gleich wahrscheinlich, 3 sind günstig: P(rot) = 3/8."
        links:
          - title: Laplace-Experiment (Serlo)
            url: https://de.serlo.org/mathe/1755/laplace-experiment
      - type: generated
        id: laplace-ueben
        given:
          e: { pick: 1, from: { data: zufallsversuche } }
        task:
          text: "{{e.versuch}} Wie groß ist die Wahrscheinlichkeit für das Ereignis „{{e.ereignis}}“?"
        answer:
          value: "e.p"
          compare: { choice: "[e.p, e.fUngunstig, e.fRest, e.fEins]" }
        mistakes:
          - value: "e.fUngunstig"
            message: Das ist günstige durch ungünstige. Im Nenner stehen alle Ergebnisse.
          - value: "e.fRest"
            message: Du hast die ungünstigen Ergebnisse gezählt. Zähle die günstigen.
          - value: "e.fEins"
            message: Du hast nur ein günstiges Ergebnis gezählt.
        hint: Schreib zuerst alle Ergebnisse auf. Dann markiere die günstigen.
        steps:
          - "Alle Ergebnisse: {{e.omega}}. Das sind {{e.anzahl}}, alle gleich wahrscheinlich."
          - "Günstig sind {{e.guenstigListe}}, also {{e.guenstig}} Ergebnisse."
          - '$P(E) = \frac{{{e.guenstig}}}{{{e.anzahl}}}$, gekürzt {{answer}}.'
      - type: true-false
        id: laplace-augensumme
        text: "Mit zwei Würfeln sind die Augensummen 2 bis 12 möglich, also 11 Ergebnisse. Darum ist P(Augensumme 12) = 1/11."
        answer: false
        explanation: "Die Augensummen sind nicht gleich wahrscheinlich: 12 gibt es nur als 6 + 6, die 7 auf sechs Arten."
        links:
          - title: Laplace-Experiment (Serlo)
            url: https://de.serlo.org/mathe/1755/laplace-experiment
      - type: generated
        id: laplace-anzahl
        given:
          n: { oneOf: [6, 8, 9, 10] }
          d: { oneOf: [3, 4, 5] }
          z: { int: [1, 4] }
        where: ["decimals(n / d) == 0", "z < d", "n > d", "not (d == 4 and z == 2)"]
        task:
          text: "In einer Urne liegen {{n}} Kugeln, rote und blaue. Die Wahrscheinlichkeit, eine rote zu ziehen, ist $\\frac{ {{z}} }{ {{d}} }$. Wie viele rote Kugeln liegen in der Urne?"
        answer: { value: "z * n / d", compare: { number: { format: integer } } }
        mistakes:
          - value: "z"
            message: "Der Bruch ist gekürzt. Eigentlich stehen im Nenner alle {{n}} Kugeln."
          - value: "n - z * n / d"
            message: Das sind die blauen Kugeln.
        hint: "Erweitere den Bruch so, dass im Nenner {{n}} steht."
        steps:
          - "P(rot) = rote Kugeln : {{n}} Kugeln."
          - "Erweitere $\\frac{ {{z}} }{ {{d}} }$ auf den Nenner {{n}}: Zähler {{answer}}."
          - "In der Urne liegen {{answer}} rote Kugeln."
      - type: single-choice
        id: laplace-vergleich
        text: Bei welchem Spiel hast du die größte Gewinnchance?
        options:
          - text: Würfel – Gewinn bei einer Zahl größer als 4
            correct: false
            info: "P = 1/3 = 8/24."
          - text: Glücksrad mit 8 gleich großen Feldern, 3 davon gewinnen
            correct: true
            info: "P = 3/8 = 9/24, der größte Wert."
          - text: Urne mit 3 roten und 7 blauen Kugeln – Gewinn bei Rot
            correct: false
            info: "P = 3/10, weniger als 3/9 = 1/3."
          - text: Glücksrad mit 5 gleich großen Feldern, 1 davon gewinnt
            correct: false
            info: "P = 1/5, die kleinste Chance."
        explanation: "Bringe 1/3, 3/8, 3/10 und 1/5 auf einen Nenner: 3/8 ist am größten."
        links:
          - title: Laplace-Experiment (Serlo)
            url: https://de.serlo.org/mathe/1755/laplace-experiment
      - type: text
        text: Als Nächstes führst du zwei Zufallsversuche nacheinander aus und hältst alle Wahrscheinlichkeiten in einem Baumdiagramm fest.
