# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Baumdiagramm
description: "Zwei Zufallsversuche nacheinander als Baumdiagramm zeichnen, jeden Ast mit seiner Wahrscheinlichkeit beschriften und prüfen, ob die Äste zusammen 1 ergeben."
blocks:
  - type: text
    text: |
      **Ziel:** Ich kann ein Baumdiagramm mit allen Wahrscheinlichkeiten zeichnen. Jeder Ast trägt eine
      Wahrscheinlichkeit, wie du sie auf der vorigen Seite berechnet hast.
  - type: section
    id: start
    title: Probier zuerst
    blocks:
      - type: number
        id: baumdiagramm-start
        text: Du wirfst eine Münze zweimal nacheinander und notierst K für Kopf und Z für Zahl, zum Beispiel KZ. Wie viele verschiedene Ergebnisse sind möglich?
        answer: 4
        tolerance: 0
        mistakes:
          - answer: 3
            message: "KZ und ZK sind verschieden: Einmal liegt beim ersten Wurf Kopf oben, einmal Zahl."
          - answer: 2
            message: "Du hast nur einen Wurf betrachtet. Es sind zwei Würfe."
        hint: Schreib zuerst alle Ergebnisse auf, die mit K beginnen.
        explanation: "Möglich sind KK, KZ, ZK und ZZ, also 4 Ergebnisse."
        links:
          - title: Mehrstufige Zufallsexperimente (Serlo)
            url: https://de.serlo.org/mathe/156048/mehrstufige-zufallsexperimente
  - type: section
    id: regel
    title: Ein Ast für jedes Ergebnis
    blocks:
      - type: text
        text: |
          Zwei Würfe nacheinander sind ein **zweistufiger Zufallsversuch**. Ein **Baumdiagramm** zeigt ihn von oben
          nach unten. Vom Startpunkt geht für jedes Ergebnis des 1. Wurfs ein **Ast** ab. Am Ende jedes Astes beginnt
          der 2. Wurf mit neuen Ästen. An jeden Ast schreibst du seine Wahrscheinlichkeit.
      - type: figure
        image: images/wahrscheinlichkeit-baum-muenze.svg
        alt: "Ein Baumdiagramm von oben nach unten. Vom Startpunkt gehen zwei Äste zu K und Z, von dort je zwei Äste zu K und Z. An jedem Ast steht 1/2. Unten stehen KK, KZ, ZK und ZZ."
        caption: "Jeder Weg von oben nach unten heißt Pfad. Die 4 Pfade sind die 4 Ergebnisse aus der Aufgabe oben."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: formula
        formula: '\Omega = \{\text{KK}; \text{KZ}; \text{ZK}; \text{ZZ}\}'
      - type: text
        text: |
          Ein Wurf endet sicher mit K oder mit Z. Darum ergeben die Äste, die von einem Punkt (einem **Knoten**)
          abgehen, zusammen 1:
      - type: formula
        formula: '\frac{1}{2} + \frac{1}{2} = 1'
      - type: text
        text: "Eine Wahrscheinlichkeit kannst du als Bruch, als Dezimalzahl oder in Prozent schreiben: 1/4 = 0,25 = 25 %. Zusammen 1 heißt dann zusammen 100 %."
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Urne mit Zurücklegen
        blocks:
          - type: text
            text: |
              In einer Urne liegen 3 rote (r) und 2 blaue (b) Kugeln. Du ziehst eine, legst sie zurück und ziehst
              noch einmal. Beim 1. Zug ist $P(r) = \frac{3}{5}$ und $P(b) = \frac{2}{5}$. Weil die Kugel zurückkommt,
              sieht die Urne beim 2. Zug genauso aus: An der 2. Stufe stehen wieder dieselben Brüche.
          - type: figure
            image: images/wahrscheinlichkeit-baum-urne.svg
            alt: "Ein Baumdiagramm mit zwei Stufen. An jedem Ast r steht 3/5, an jedem Ast b steht 2/5. Unten stehen rr, rb, br und bb."
            caption: An jedem Knoten gehen ein Ast r und ein Ast b ab.
            source: eigene Zeichnung
            licence: CC-BY-4.0
          - type: formula
            formula: '\frac{3}{5} + \frac{2}{5} = 1'
          - type: text
            text: Probe – An jedem Knoten ergeben die Äste zusammen 1. Der Baum ist vollständig beschriftet.
  - type: section
    id: merke
    title: Zusammen immer 1
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Prüfe an jedem Knoten: Die Wahrscheinlichkeiten der abgehenden Äste ergeben zusammen genau 1. Zwei
              Äste heißen nicht „je 1/2“ – das gilt nur, wenn beide Ergebnisse gleich wahrscheinlich sind. Und KZ und
              ZK sind zwei verschiedene Pfade.
  - type: section
    id: uebung
    title: Jetzt du
    blocks:
      - type: single-choice
        id: baumdiagramm-ablesen
        text: Aus einer Urne mit 2 roten und 3 blauen Kugeln wird zweimal mit Zurücklegen gezogen. Welche Wahrscheinlichkeit gehört an den Ast mit dem Fragezeichen?
        material:
          - type: figure
            image: images/wahrscheinlichkeit-baum-frage.svg
            alt: "Ein Baumdiagramm mit zwei Stufen r und b. Am Ast b der 2. Stufe ganz rechts steht ein Fragezeichen, an den übrigen Ästen r 2/5 und b 3/5."
            caption: Der Ast mit dem Fragezeichen gehört zum Pfad bb.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: 2/5
            correct: false
            info: 2/5 gehört zu Rot. Der Ast führt aber zu b.
          - text: 1/2
            correct: false
            info: Es gibt mehr blaue als rote Kugeln, die Farben sind nicht gleich wahrscheinlich.
          - text: 3/5
            correct: true
            info: Die Kugel wurde zurückgelegt, also sind wieder 3 von 5 Kugeln blau.
        explanation: "Mit Zurücklegen ist die Urne bei jedem Zug gleich, und 2/5 + 3/5 = 1."
        links:
          - title: Mehrstufige Zufallsexperimente (Serlo)
            url: https://de.serlo.org/mathe/156048/mehrstufige-zufallsexperimente
      - type: generated
        id: baumdiagramm-ergaenzen
        given:
          p: { int: [10, 90], step: 5 }
        where: ["p != 50"]
        task:
          text: "Ein geworfener Flaschendeckel landet mit der Wahrscheinlichkeit {{p}} % mit der Öffnung nach oben. Im Baumdiagramm gehen zwei Äste ab: „oben“ und „nicht oben“. Welche Wahrscheinlichkeit gehört an „nicht oben“? Gib sie in Prozent an."
        answer: { value: "100 - p", compare: { number: { format: percent, decimals: 0 } } }
        mistakes:
          - value: "p"
            message: "Das ist der Ast „oben“. Beide Äste zusammen ergeben 100 %."
          - value: "50"
            message: "Zwei Äste heißen nicht halb-halb. Rechne mit den {{p}} %."
        hint: Die Äste an einem Knoten ergeben zusammen 1, also 100 %.
        steps:
          - "Am Ast „oben“ stehen {{p}} %. Beide Äste zusammen ergeben 100 %."
          - "100 % − {{p}} % = {{answer}} %"
      - type: true-false
        id: baumdiagramm-summe
        text: "An den drei Ästen eines Knotens stehen 1/2, 1/3 und 1/4. Dieser Baum kann richtig beschriftet sein."
        answer: false
        explanation: "Zum Addieren bringst du die Brüche auf den Hauptnenner 12 (kennst du aus Klasse 6; zum Wiederholen: Seite „Brüche addieren und subtrahieren“ im Kapitel Bruchrechnung). 1/2 + 1/3 + 1/4 = 6/12 + 4/12 + 3/12 = 13/12. Das ist mehr als 1."
        links:
          - title: Mehrstufige Zufallsexperimente (Serlo)
            url: https://de.serlo.org/mathe/156048/mehrstufige-zufallsexperimente
      - type: generated
        id: baumdiagramm-pfade
        given:
          n: { int: [3, 8] }
        task:
          text: "Du wirfst eine Münze und drehst danach ein Glücksrad mit {{n}} gleich großen Feldern. Wie viele Pfade hat das vollständige Baumdiagramm?"
        answer: { value: "2 * n", compare: { number: { format: integer } } }
        mistakes:
          - value: "n + 2"
            message: "Du hast addiert. An jedem der 2 Münz-Äste hängen {{n}} Glücksrad-Äste."
          - value: "n"
            message: "So viele Äste hat nur ein Knoten. Die 2. Stufe beginnt an beiden Münz-Ästen."
        hint: Zeichne die 1. Stufe. Wie viele Äste hängen an jedem ihrer Enden?
        steps:
          - "1. Stufe: 2 Äste (K und Z). An jedem Ende hängen {{n}} Äste für das Glücksrad."
          - "2 · {{n}} = {{answer}} Pfade."
      - type: single-choice
        id: baumdiagramm-gluecksrad
        text: "Das Glücksrad wird zweimal gedreht. Du notierst nur T für Treffer, wenn die Zahl größer als 5 ist, sonst N für Niete. Wie ist der Baum richtig beschriftet?"
        material:
          - type: figure
            image: images/wahrscheinlichkeit-gluecksrad.svg
            alt: Ein Glücksrad mit 8 gleich großen Feldern, beschriftet mit 1 bis 8, oben ein Zeiger.
            caption: Alle 8 Felder sind gleich groß.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: "An jedem Knoten T 3/8 und N 5/8"
            correct: true
            info: "Größer als 5 sind 6, 7 und 8: 3 von 8 Feldern, bei jedem Drehen."
          - text: "An jedem Knoten T 1/2 und N 1/2"
            correct: false
            info: "T und N sind nicht gleich wahrscheinlich: N hat mehr Felder."
          - text: "1. Stufe T 3/8 und N 5/8, 2. Stufe T 3/16 und N 5/16"
            correct: false
            info: "3/16 und 5/16 ergeben zusammen nur 1/2, nicht 1."
        explanation: "Jede Stufe ist „günstige durch alle“: T 3/8, N 5/8."
        links:
          - title: Mehrstufige Zufallsexperimente (Serlo)
            url: https://de.serlo.org/mathe/156048/mehrstufige-zufallsexperimente
      - type: text
        text: Als Nächstes rechnest du mit den Ästen deines Baums die Wahrscheinlichkeit eines ganzen Pfades aus.
