<svg xmlns="http://www.w3.org/2000/svg" width="320" height="210" viewBox="0 0 320 210" font-family="sans-serif" font-size="14">
  <title>Ein Dreieck ABC mit der Seite c unten und drei eingezeichneten Strecken 1, 2 und 3 von C aus</title>
  <rect width="320" height="210" fill="#ffffff"/>
  <polygon points="40,170 280,170 120,40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="25" y="190" fill="#1e3a8a">A</text><text x="285" y="190" fill="#1e3a8a">B</text><text x="115" y="32" fill="#1e3a8a">C</text>
  <text x="155" y="192" fill="#1e3a8a">c</text>
  <line x1="120" y1="40" x2="160" y2="170" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="120" y1="40" x2="120" y2="170" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="120" y1="40" x2="70" y2="170" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="140" fill="#111827" font-weight="bold">1</text>
  <text x="124" y="140" fill="#111827" font-weight="bold">2</text>
  <text x="150" y="140" fill="#111827" font-weight="bold">3</text>
</svg>
