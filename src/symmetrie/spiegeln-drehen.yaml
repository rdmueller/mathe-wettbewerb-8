# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Spiegeln und Drehen
description: "Punkte und Figuren im Koordinatensystem an einer Achse spiegeln und um einen Drehpunkt um 90° oder 180° drehen."
blocks:
  - type: text
    text: |
      **Ziel:** Ich kann Figuren an einer Achse spiegeln und um einen Punkt drehen. Auf der vorigen Seite hast du
      Symmetrien geprüft. Jetzt erzeugst du das Bild einer Figur selbst – im Koordinatensystem, mit Zahlen.
  - type: section
    id: start
    title: Probier zuerst
    blocks:
      - type: number
        id: spiegeln-drehen-start
        text: "Der Punkt P(1 | 3) wird an der Achse g gespiegelt. Sein Bildpunkt heißt P'. Welche x-Koordinate hat P'?"
        material:
          - type: figure
            image: images/symmetrie-spiegeln-start.svg
            alt: "Ein Koordinatensystem, x von 0 bis 8, y von 0 bis 5. Die blaue senkrechte Spiegelachse g geht durch alle Punkte mit x = 4. Links davon liegt der Punkt P bei (1 | 3)."
            caption: "Die Achse g ist die senkrechte Gerade, auf der jeder Punkt die x-Koordinate 4 hat."
            source: eigene Zeichnung
            licence: CC-BY-4.0
        answer: 7
        tolerance: 0
        mistakes:
          - answer: 4
            message: "Bei x = 4 liegt die Achse selbst. P' liegt auf der anderen Seite der Achse."
          - answer: 3
            message: "3 ist der Abstand zur Achse, nicht die x-Koordinate von P'."
        hint: Zähle, wie viele Kästchen P von der Achse entfernt ist.
        explanation: "P liegt 3 links von der Achse, P' genauso weit rechts: x = 4 + 3 = 7."
        links:
          - title: Achsensymmetrie (Serlo)
            url: https://de.serlo.org/mathe/35620/achsensymmetrie
  - type: section
    id: regel
    title: Spiegeln und drehen im Gitter
    blocks:
      - type: text
        text: |
          So wie in der Aufgabe spiegelst du jeden Punkt: Geh von P aus **senkrecht** zur Achse, also im rechten
          Winkel. Miss den Abstand und trag ihn auf der anderen Seite noch einmal ab. Eine Figur spiegelst du Ecke für
          Ecke.
      - type: figure
        image: images/symmetrie-spiegeln.svg
        alt: "Ein Koordinatensystem mit der blauen senkrechten Achse g bei x = 5. Links das blaue Dreieck ABC, rechts sein oranges Spiegelbild A'B'C'. Gestrichelte Linien verbinden jeden Punkt mit seinem Bildpunkt und stehen senkrecht auf g."
        caption: "C liegt 2 Kästchen links von g, C' 2 rechts davon. Jede Verbindungslinie trifft g im rechten Winkel."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: text
        text: |
          Im Heft legst du die Mittellinie des Geodreiecks auf die Achse und die lange Kante durch P.

          Beim **Drehen** um einen Drehpunkt Z bleibt jeder Punkt gleich weit von Z entfernt. Der Winkel sagt, wie
          weit gedreht wird. In der Mathematik dreht man **gegen den Uhrzeigersinn**, wenn nichts anderes dasteht.
          Im Gitter zählst du den Weg von Z zum Punkt und drehst diesen Weg mit.
      - type: figure
        image: images/symmetrie-drehen.svg
        alt: "Ein Koordinatensystem. Drehpunkt Z bei (4 | 3), Punkt P bei (7 | 4), Bildpunkt P' bei (3 | 6). Ein blauer Weg führt von Z 3 nach rechts und 1 nach oben zu P, ein oranger von Z 3 nach oben und 1 nach links zu P'. Ein Bogen zeigt die Vierteldrehung um 90° gegen den Uhrzeigersinn."
        caption: Der ganze Weg von Z aus dreht sich mit – aus „rechts“ wird „oben“, aus „oben“ wird „links“.
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: "Drehung von P(7 | 4) um Z(4 | 3) gegen den Uhrzeigersinn"
        header: [Drehung, Weg von Z aus, Punkt]
        rows:
          - ["0°", "3 rechts, 1 hoch", "(7 | 4)"]
          - ["90°", "3 hoch, 1 links", "(3 | 6)"]
          - ["180°", "3 links, 1 runter", "(1 | 2)"]
      - type: text
        text: Die Drehung um 180° ist die halbe Drehung von der vorigen Seite. Bei ihr ist die Richtung egal.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: Eine waagerechte Achse und ein Punkt auf der Achse
        blocks:
          - type: text
            text: |
              Das Dreieck mit A(1 | 1), B(5 | 2) und C(3 | 4) wird an der waagerechten Geraden y = 4 gespiegelt.
              Jetzt bleibt die x-Koordinate, und die y-Koordinate ändert sich.

              - A liegt 3 Kästchen unter der Achse, A' 3 darüber: y = 4 + 3 = 7.
              - B liegt 2 Kästchen unter der Achse, B' 2 darüber: y = 4 + 2 = 6.
              - C liegt auf der Achse. Sein Abstand ist 0, also bleibt C, wo er ist.
          - type: text
            text: "Antwort – A'(1 | 7), B'(5 | 6) und C' = C(3 | 4)."
  - type: section
    id: merke
    title: Senkrecht messen, Richtung lesen
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Miss den Abstand immer senkrecht zur Achse. Bei einer schrägen Achse heißt das: schräg durchs Gitter,
              nicht waagerecht. Und lies beim Drehen genau, in welche Richtung gedreht wird: Bei 90° gegen den
              Uhrzeigersinn landet der Punkt woanders als bei 90° mit dem Uhrzeigersinn.
  - type: section
    id: uebung
    title: Jetzt du
    blocks:
      - type: single-choice
        id: spiegeln-drehen-schraeg
        text: Der Punkt P wird an der schrägen Achse g gespiegelt. Welcher der markierten Punkte ist sein Bildpunkt P'?
        material:
          - type: figure
            image: images/symmetrie-schraege-achse.svg
            alt: "Ein Koordinatensystem, x und y von 0 bis 7. Die blaue schräge Achse g geht durch (0 | 0) und (7 | 7). Der Punkt P liegt bei (1 | 4). Drei Punkte sind mit 1, 2 und 3 markiert."
            caption: Die Achse g geht schräg durch das Gitter, durch jeden Gitterpunkt mit gleicher x- und y-Koordinate.
            source: eigene Zeichnung
            licence: CC-BY-4.0
        options:
          - text: Punkt 1
            correct: false
            info: Punkt 1 liegt auf der Achse, nicht auf ihrer anderen Seite.
          - text: Punkt 2
            correct: true
            info: "Von P geht es im rechten Winkel zur Achse bis (2,5 | 2,5) und noch einmal so weit: zu Punkt 2."
          - text: Punkt 3
            correct: false
            info: Zu Punkt 3 kommst du, wenn du waagerecht misst – nicht im rechten Winkel zu g.
        explanation: Nur die Verbindung von P zu Punkt 2 trifft g im rechten Winkel und wird von g halbiert.
        links:
          - title: Achsensymmetrie (Serlo)
            url: https://de.serlo.org/mathe/35620/achsensymmetrie
      - type: generated
        id: spiegeln-drehen-achse
        given:
          a: { int: [3, 7] }
          x: { int: [0, 6] }
          y: { int: [1, 8] }
        where: ["x < a"]
        task:
          text: "Der Punkt P({{x}} | {{y}}) wird an der senkrechten Geraden x = {{a}} gespiegelt. Welche x-Koordinate hat der Bildpunkt P'?"
        answer: { value: "2 * a - x", compare: { number: { format: integer } } }
        mistakes:
          - value: "a"
            message: Das ist die Achse selbst.
          - value: "a - x"
            message: Das ist nur der Abstand zur Achse.
        hint: Wie viele Kästchen liegt P links von der Achse?
        steps:
          - "Die Achse liegt bei x = {{a}}. P liegt {{a}} − {{x}} Kästchen links davon."
          - "P' liegt genauso weit rechts: {{a}} + ({{a}} − {{x}}) = {{answer}}. Die y-Koordinate {{y}} bleibt."
      - type: generated
        id: spiegeln-drehen-halbe
        given:
          zx: { int: [3, 7] }
          zy: { int: [2, 6] }
          px: { int: [0, 6] }
          py: { int: [0, 8] }
        where: ["px < zx", "py != zy"]
        task:
          text: "Der Punkt P({{px}} | {{py}}) wird um den Drehpunkt Z({{zx}} | {{zy}}) um 180° gedreht. Welche x-Koordinate hat der Bildpunkt P'?"
        answer: { value: "2 * zx - px", compare: { number: { format: integer } } }
        mistakes:
          - value: "px"
            message: Das ist die x-Koordinate von P selbst.
          - value: "zx"
            message: Das ist der Drehpunkt selbst.
        hint: "Bei 180° wird aus „links von Z“ „rechts von Z“."
        steps:
          - "P liegt {{zx}} − {{px}} Kästchen links von Z."
          - "P' liegt genauso weit rechts von Z: {{zx}} + ({{zx}} − {{px}}) = {{answer}}."
      - type: generated
        id: spiegeln-drehen-viertel
        given:
          zx: { int: [3, 7] }
          zy: { int: [1, 5] }
          px: { int: [4, 10] }
          py: { int: [2, 9] }
        where: ["px > zx", "py > zy", "px - zx <= 4", "py - zy <= 4", "zx + zy - py >= 0", "px - py != zx - zy"]
        task:
          text: "Der Punkt P({{px}} | {{py}}) wird um den Drehpunkt Z({{zx}} | {{zy}}) um 90° gegen den Uhrzeigersinn gedreht. Welche x-Koordinate hat der Bildpunkt P'?"
        answer: { value: "zx + zy - py", compare: { number: { format: integer } } }
        mistakes:
          - value: "zx + py - zy"
            message: Du hast mit dem Uhrzeigersinn gedreht.
          - value: "2 * zx - px"
            message: Das wäre eine halbe Drehung (180°).
        hint: Schreib den Weg von Z zu P auf und dreh ihn mit.
        steps:
          - "Von Z nach P: {{px}} − {{zx}} nach rechts und {{py}} − {{zy}} nach oben."
          - "Nach 90° gegen den Uhrzeigersinn wird aus „nach oben“ „nach links“."
          - "P' liegt also {{py}} − {{zy}} links von Z: x = {{zx}} − ({{py}} − {{zy}}) = {{answer}}."
      - type: number
        id: spiegeln-drehen-zwei-achsen
        text: "P(1 | 2) wird an der Geraden x = 3 gespiegelt. Den Bildpunkt P' spiegelst du an der Geraden x = 7 und erhältst P''. Welche x-Koordinate hat P''?"
        answer: 9
        tolerance: 0
        mistakes:
          - answer: 5
            message: "Das ist P'. Spiegle P' noch an x = 7."
          - answer: 13
            message: "Du hast P statt P' an x = 7 gespiegelt."
        hint: Rechne erst P' aus.
        explanation: "P'(5 | 2), dann P''(9 | 2). P wandert um 8 – doppelt so weit, wie die Achsen auseinanderliegen."
        links:
          - title: Kongruenz (Serlo)
            url: https://de.serlo.org/mathe/1925/kongruenz
      - type: true-false
        id: spiegeln-drehen-richtung
        text: Bei einer Drehung um 180° ist es egal, ob du mit oder gegen den Uhrzeigersinn drehst.
        answer: true
        explanation: "Beide halben Drehungen enden an derselben Stelle. Bei 90° ist das anders."
        links:
          - title: Punktsymmetrie (Serlo)
            url: https://de.serlo.org/mathe/35721/punktsymmetrie
      - type: text
        text: Im nächsten Kapitel geht es um [Winkel](/winkel/winkelsumme/) – im Dreieck und an sich kreuzenden Geraden.
