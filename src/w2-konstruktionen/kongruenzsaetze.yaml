# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title: Kongruenzsätze
description: "An den gegebenen Stücken erkennen, welcher Kongruenzsatz passt – SSS, SWS, WSW oder SsW – und ob das Dreieck eindeutig ist."
blocks:
  - type: text
    text: |
      **Ziel:** Ich kann erkennen, welcher Kongruenzsatz passt und ob das Dreieck eindeutig ist. Du schaust dafür
      auf die gefärbten Stücke deiner [Planfigur](/w2-konstruktionen/planfigur/).
  - type: section
    id: start
    title: Probier zuerst
    blocks:
      - type: single-choice
        id: kongruenzsaetze-start
        text: "Drei Freunde zeichnen jeder ein Dreieck mit α = 60°, β = 60° und γ = 60°. Was kommt heraus?"
        options:
          - text: Alle drei Dreiecke sind genau gleich.
            correct: false
            info: Die Winkel sagen nichts über die Länge der Seiten. Eines kann 3 cm lange Seiten haben, ein anderes 8 cm lange.
          - text: Die Dreiecke haben dieselbe Form, können aber verschieden groß sein.
            correct: true
            info: Alle drei sind gleichseitig, aber jeder wählt die Länge der Seiten selbst.
          - text: So ein Dreieck gibt es nicht.
            correct: false
            info: 60° + 60° + 60° = 180°. Das passt zur Winkelsumme, das Dreieck gibt es.
        explanation: Drei Winkel legen nur die Form fest. Für die Größe fehlt eine Länge.
        links:
          - title: Konstruierbare Dreiecke (Serlo)
            url: https://de.serlo.org/mathe/78680/konstruierbare-dreiecke
  - type: section
    id: regel
    title: Welche drei Stücke reichen?
    blocks:
      - type: text
        text: |
          Zwei Dreiecke heißen **kongruent** (deckungsgleich), wenn sie genau aufeinanderpassen. Ein Dreieck ist
          **eindeutig**, wenn alle, die es nach denselben Angaben konstruieren, kongruente Dreiecke bekommen. Die
          Aufgabe oben zeigt: Drei Winkel reichen dafür nicht. Die **Kongruenzsätze** sagen, welche drei Stücke
          reichen. S steht für Seite, W für Winkel.
      - type: figure
        image: images/w2-kongruenzsaetze.svg
        alt: "Vier Dreiecke mit blauen gegebenen Stücken: SSS alle drei Seiten; SWS die Seiten b und c und der Winkel α, wo sie sich treffen; WSW die Seite c und die Winkel α und β an ihren Enden; SsW die Seiten a und b und der Winkel β."
        caption: "Achte darauf, wo der blaue Winkel liegt: zwischen den Seiten, an der Seite oder einer Seite gegenüber. Bei SsW ist b die längere Seite."
        source: eigene Zeichnung
        licence: CC-BY-4.0
      - type: table
        caption: Die vier Kongruenzsätze
        header: [Satz, gegeben, Beispiel]
        rows:
          - [SSS, drei Seiten, "a, b, c"]
          - [SWS, zwei Seiten und der Winkel dazwischen, "b, c, α"]
          - [WSW, eine Seite und die zwei Winkel an ihr, "c, α, β"]
          - [SsW, zwei Seiten und der Winkel gegenüber der längeren, "a, b, β mit b > a"]
      - type: text
        text: |
          Bei SSS müssen die zwei kürzeren Seiten zusammen länger sein als die längste – sonst gibt es gar kein
          Dreieck. Liegen zwei gegebene Winkel nicht beide an der Seite (manche nennen das **SWW**), rechnest du den
          dritten mit der Winkelsumme aus. Dann hast du WSW.
  - type: section
    id: beispiel
    title: Ein Beispiel
    blocks:
      - type: example
        title: "c = 7 cm, α = 50°, γ = 70°"
        blocks:
          - type: text
            text: |
              In der Planfigur liegt α bei A, also an c. γ liegt bei C, gegenüber von c. Das ist noch kein Satz aus der
              Tabelle. Rechne den dritten Winkel aus:
          - type: formula
            formula: '\beta = 180^\circ - 50^\circ - 70^\circ = 60^\circ'
          - type: text
            text: Jetzt liegen α und β an c – das ist WSW. Das Dreieck ist eindeutig.
  - type: section
    id: merke
    title: Groß S und klein s
    blocks:
      - type: note
        title: Merke
        blocks:
          - type: text
            text: |
              Bei **SsW** liegt der Winkel der längeren Seite (großes S) gegenüber. Liegt er der kürzeren gegenüber,
              heißt das **sSW**: Der Zirkelbogen kann den freien Schenkel zweimal schneiden, dann gibt es zwei
              verschiedene Dreiecke. sSW und WWW sind **nicht eindeutig**.
          - type: figure
            image: images/w2-ssw.svg
            alt: "Die Seite c = 6 cm mit dem Winkel α = 30° bei A. Ein grauer Kreisbogen um B mit Radius 4 cm schneidet den freien Schenkel von α in zwei Punkten C1 und C2. Beide orangen Strecken von B aus sind a = 4 cm lang."
            caption: "Gegeben a = 4 cm, c = 6 cm, α = 30°. α liegt der kürzeren Seite a gegenüber – C1 und C2 passen beide."
            source: eigene Zeichnung
            licence: CC-BY-4.0
  - type: section
    id: uebung
    title: Jetzt du
    blocks:
      - type: generated
        id: kongruenzsaetze-satz
        given:
          e: { pick: 1, from: { data: kongruenzsaetze } }
        task:
          text: "Gegeben sind {{e.stuecke}}. Welcher Satz passt?"
        answer:
          value: "e.satz"
          compare: { choice: "['SSS', 'SWS', 'WSW', 'SsW', 'sSW', 'WWW']" }
        mistakes:
          - value: "e.verwechselt"
            message: "{{e.warum}}"
        hint: Skizziere eine Planfigur und färbe die gegebenen Stücke. Wo liegt jeder gegebene Winkel?
        steps:
          - "{{e.lage}}"
          - "Das passt zu {{answer}}."
      - type: generated
        id: kongruenzsaetze-eindeutig
        given:
          e: { pick: 1, from: { data: kongruenzsaetze } }
        task:
          text: "Gegeben sind {{e.stuecke}}. Ist das Dreieck damit eindeutig festgelegt?"
        answer:
          value: "e.eindeutig"
          compare: { choice: "['eindeutig', 'nicht eindeutig']" }
        mistakes:
          - value: "e.gegenteil"
            message: "{{e.begruendung}}"
        hint: Welcher Satz passt? Nur sSW und WWW sind nicht eindeutig.
        steps:
          - "{{e.lage}} Das ist {{e.satz}}."
          - "Darum ist das Dreieck {{answer}}."
      - type: true-false
        id: kongruenzsaetze-ssw-richtig
        text: "Bei b = 5 cm, c = 8 cm und γ = 50° kann es zwei verschiedene Dreiecke geben."
        answer: false
        explanation: "γ liegt bei C, also der Seite c gegenüber. c ist mit 8 cm die längere Seite: SsW, das Dreieck ist eindeutig."
        links:
          - title: Konstruierbare Dreiecke (Serlo)
            url: https://de.serlo.org/mathe/78680/konstruierbare-dreiecke
      - type: multiple-choice
        id: kongruenzsaetze-welche
        text: Mit welchen Angaben kannst du genau ein Dreieck konstruieren?
        options:
          - text: "c = 5 cm, α = 40°, β = 80°"
            correct: true
            info: α und β liegen an c. Das ist WSW, eindeutig.
          - text: "α = 40°, β = 80°, γ = 60°"
            correct: false
            info: "Nur Winkel: WWW. Die Größe ist nicht festgelegt."
          - text: "a = 6 cm, b = 8 cm, γ = 90°"
            correct: true
            info: γ liegt bei C zwischen a und b. Das ist SWS, eindeutig.
          - text: "a = 3 cm, b = 4 cm, c = 8 cm"
            correct: false
            info: 3 cm + 4 cm = 7 cm ist kürzer als 8 cm. Die Kreise treffen sich nicht, das Dreieck gibt es nicht.
        explanation: Prüfe bei jeder Angabe den Satz – und bei drei Seiten, ob die zwei kürzeren zusammen länger sind als die längste.
        links:
          - title: Konstruierbare Dreiecke (Serlo)
            url: https://de.serlo.org/mathe/78680/konstruierbare-dreiecke
      - type: single-choice
        id: kongruenzsaetze-begruendung
        text: "Lisa soll ein Dreieck mit b = 6 cm, c = 4 cm und γ = 35° konstruieren. Sie sagt: „Das ist SsW, also eindeutig.“ Hat sie recht?"
        options:
          - text: Ja, zwei Seiten und ein Winkel reichen immer.
            correct: false
            info: Das kommt darauf an, wo der Winkel liegt. Nur SWS und SsW sind eindeutig.
          - text: Ja, denn γ liegt der längeren Seite b gegenüber.
            correct: false
            info: γ liegt bei C. Gegenüber von C liegt c, nicht b.
          - text: Nein, γ liegt der kürzeren Seite c gegenüber. Es kann zwei Dreiecke geben.
            correct: true
            info: c ist mit 4 cm kürzer als b. Das ist sSW, nicht eindeutig.
          - text: Nein, γ liegt nicht zwischen b und c, also gibt es gar kein Dreieck.
            correct: false
            info: Das Dreieck gibt es – es ist nur nicht eindeutig.
        explanation: "γ liegt c gegenüber, und c ist die kürzere Seite: sSW. Der Zirkelbogen um A mit 4 cm schneidet den freien Schenkel von γ zweimal."
        links:
          - title: Konstruierbare Dreiecke (Serlo)
            url: https://de.serlo.org/mathe/78680/konstruierbare-dreiecke
      - type: text
        text: Als Nächstes nutzt du den Satz, um die Schritte einer Konstruktion zu planen.
