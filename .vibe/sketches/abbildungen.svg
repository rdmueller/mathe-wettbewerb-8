<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" font-family="sans-serif" font-size="12">
  <title>Skizze der Abbildungsarten und Farbregeln</title>
  <rect width="360" height="520" fill="#fff" stroke="#999"/>
  <text x="16" y="24" font-weight="bold">Koordinatensystem: Gerade / Hyperbel</text>
  <line x1="30" y1="160" x2="170" y2="160" stroke="#333"/><line x1="30" y1="160" x2="30" y2="40" stroke="#333"/>
  <line x1="30" y1="160" x2="150" y2="50" stroke="#36c" stroke-width="2"/>
  <path d="M45,45 Q60,140 165,150" fill="none" stroke="#e80" stroke-width="2"/>
  <text x="190" y="80">blau: proportional</text><text x="190" y="100">orange: antiproportional</text>
  <text x="16" y="200" font-weight="bold">Baumdiagramm (oben → unten, Äste = 1)</text>
  <circle cx="180" cy="220" r="4"/>
  <line x1="180" y1="220" x2="100" y2="280" stroke="#36c"/><line x1="180" y1="220" x2="260" y2="280" stroke="#36c"/>
  <text x="120" y="245">3/5</text><text x="225" y="245">2/5</text>
  <line x1="100" y1="280" x2="70" y2="330" stroke="#36c"/><line x1="100" y1="280" x2="130" y2="330" stroke="#36c"/>
  <line x1="260" y1="280" x2="230" y2="330" stroke="#36c"/><line x1="260" y1="280" x2="290" y2="330" stroke="#36c"/>
  <text x="60" y="345">r</text><text x="125" y="345">b</text><text x="225" y="345">r</text><text x="285" y="345">b</text>
  <text x="16" y="380" font-weight="bold">Winkel an Parallelen</text>
  <line x1="30" y1="420" x2="330" y2="420" stroke="#333"/><line x1="30" y1="480" x2="330" y2="480" stroke="#333"/>
  <line x1="120" y1="500" x2="240" y2="400" stroke="#333"/>
  <path d="M 162 420 A 14 14 0 0 1 176 420" fill="none" stroke="#36c" stroke-width="3"/>
  <path d="M 92 480 A 14 14 0 0 1 106 480" fill="none" stroke="#36c" stroke-width="3"/>
  <text x="200" y="460">gleiche Farbe = gleich groß (Stufenwinkel)</text>
  <text x="16" y="510" fill="#555" font-size="11">Alle Bilder: Text-Alternative, nie die Lösung im Bild</text>
</svg>
