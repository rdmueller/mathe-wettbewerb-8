<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" font-family="sans-serif" font-size="12">
  <title>Skizze Musterseite flaechen/dreieck bei 360 px</title>
  <rect width="360" height="900" fill="#fff" stroke="#999"/>
  <text x="16" y="28" font-size="16" font-weight="bold">Flächeninhalt des Dreiecks</text>
  <text x="16" y="48" fill="#555">Ziel: Ich kann A und u eines Dreiecks berechnen –</text>
  <text x="16" y="62" fill="#555">auch wenn die Höhe außen liegt.</text>
  <rect x="16" y="76" width="328" height="120" fill="#eef4ff" stroke="#36c"/>
  <text x="24" y="94" font-weight="bold">start · Probier zuerst</text>
  <rect x="40" y="104" width="120" height="70" fill="none" stroke="#36c"/>
  <line x1="40" y1="174" x2="160" y2="104" stroke="#e80" stroke-width="2"/>
  <text x="172" y="130">Rechteck 6 cm × 4 cm halbiert.</text>
  <text x="172" y="146">Wie groß ist ein Dreieck?</text>
  <rect x="172" y="156" width="60" height="22" fill="#fff" stroke="#999"/><text x="238" y="171">cm²  [Prüfen]</text>
  <rect x="16" y="208" width="328" height="190" fill="#fff" stroke="#999"/>
  <text x="24" y="226" font-weight="bold">regel · Vom Rechteck zum Dreieck</text>
  <polygon points="40,360 200,360 90,260" fill="#eef4ff" stroke="#36c" stroke-width="2"/>
  <line x1="90" y1="260" x2="90" y2="360" stroke="#e80" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="96" y="320" fill="#e80">h</text><text x="110" y="376" fill="#36c">g</text>
  <polygon points="230,360 300,360 215,280" fill="#eef4ff" stroke="#36c" stroke-width="2"/>
  <line x1="215" y1="280" x2="215" y2="360" stroke="#e80" stroke-dasharray="5 4" stroke-width="2"/>
  <line x1="215" y1="360" x2="230" y2="360" stroke="#36c" stroke-dasharray="2 3"/>
  <text x="250" y="300" font-size="11">Höhe außen</text>
  <text x="24" y="392">A = (g · h) : 2   (formula)</text>
  <rect x="16" y="410" width="328" height="90" fill="#f6f6f6" stroke="#999"/>
  <text x="24" y="428" font-weight="bold">beispiel · Box mit Rechenweg</text>
  <text x="24" y="446">g = 8 cm, h = 5 cm → 8 · 5 = 40 → 40 : 2 = 20 cm²</text>
  <rect x="16" y="512" width="328" height="60" fill="#fff4e6" stroke="#e80"/>
  <text x="24" y="530" font-weight="bold">merke · Höhe ≠ schräge Seite</text>
  <text x="24" y="548">Die Höhe steht senkrecht auf g – nie die Schrägseite.</text>
  <rect x="16" y="584" width="328" height="300" fill="#fff" stroke="#999"/>
  <text x="24" y="602" font-weight="bold">uebung · Jetzt du (leicht → schwer)</text>
  <text x="24" y="626">1  Welche Strecke ist die Höhe zu c? (single-choice, Bild)</text>
  <text x="24" y="650">2  A berechnen, neue Zahlen (generated)</text>
  <text x="34" y="666" fill="#c33" font-size="11">Fehler g·h → „Durch 2 teilen vergessen.“</text>
  <text x="24" y="690">3  Höhe außen: A eines stumpfen Dreiecks (generated)</text>
  <text x="24" y="714">4  Umfang u = a + b + c (generated, Merke cm statt cm²)</text>
  <text x="24" y="738">5  A gegeben, h gesucht – rückwärts (generated)</text>
  <text x="24" y="770" fill="#555">Danach: Weiter zu Parallelogramm und Trapez →</text>
  <text x="24" y="800" fill="#555" font-size="11">Farben: gegeben blau, gesucht orange, Höhe gestrichelt</text>
</svg>
