<li class="explainer-assessment-item" data-key="a6"><p class="explainer-assessment-label">Aufgabe 6</p><div class="question" id="frage-a6" data-id="a6" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Konstruiere das Dreieck mit b = 5 cm, c = 6 cm und α = 50° (SWS). Bring die Schritte in die richtige Reihenfolge.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Kreis um A mit r = 5 cm: Er schneidet den freien Schenkel in C.</span> <select name="frage-a6-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>C mit B verbinden</span> <select name="frage-a6-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>an A den Winkel α = 50° antragen</span> <select name="frage-a6-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>c = 6 cm zeichnen, Endpunkte A und B</span> <select name="frage-a6-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
<li><label><span>Planfigur skizzieren, b, c und α färben</span> <select name="frage-a6-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Planfigur skizzieren, b, c und α färben, 2. c = 6 cm zeichnen, Endpunkte A und B, 3. an A den Winkel α = 50° antragen, 4. Kreis um A mit r = 5 cm: Er schneidet den freien Schenkel in C., 5. C mit B verbinden</p>
<p class="question-explanation">α liegt zwischen b und c. Nach c kommt α, dann trägst du b mit dem Zirkel auf dem freien Schenkel ab.</p>

</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>

</div></li>
<li class="explainer-assessment-item" data-key="a7"><p class="explainer-assessment-label">Aufgabe 7</p><div class="explainer-assessment-live"></div></li>
<li class="explainer-assessment-item" data-key="a8"><p class="explainer-assessment-label">Aufgabe 8</p><div class="question" id="frage-a8" data-id="a8" data-type="number">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">In einem Dreieck ABC ist α = 70° und β = 50°. Die Winkelhalbierende von γ trifft die Seite c im Punkt D. Wie groß ist der Winkel bei D zwischen DA und DC?</legend>
<div class="question-material"><figure class="block-figure"><img src="../../images/w2-winkelhalbierende-aufgabe.svg" alt="Ein Dreieck ABC mit den blauen Winkeln α bei A und β bei B. Die lila Winkelhalbierende geht von C zum Punkt D auf c. Bei D ist zwischen DA und DC ein oranger Winkel mit Fragezeichen markiert." loading="lazy" decoding="async"><figcaption><p>Die Winkelhalbierende teilt γ in zwei gleiche Winkel. Das Bild ist nicht maßstäblich.</p> <span class="block-credit">Quelle: eigene Zeichnung. Lizenz: CC-BY-4.0.</span></figcaption></figure></div>
<label class="question-number">Deine Antwort <input type="text" inputmode="decimal" autocomplete="off" name="frage-a8" aria-describedby="frage-a8-unit"> <span id="frage-a8-unit">°</span> </label>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 80 °</p>
<p class="question-explanation">γ = 180° − 70° − 50° = 60°, die Hälfte ist 30°. Im Dreieck ADC gilt: Winkel bei D = 180° − 70° − 30° = 80°.</p>
<p class="question-more"><a class="question-more-link" href="https://de.wikipedia.org/wiki/Winkelhalbierende" rel="noopener" title="Winkelhalbierende (Wikipedia)"><svg class="question-more-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="4.75" r="1" fill="currentColor"/><path d="M8 7v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span class="question-more-text">Mehr dazu: Winkelhalbierende (Wikipedia)</span></a></p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
